# prod.yaml
# Misma estructura que dev.yaml, pero escucha la rama "main" y usa el target
# "production" (catalog dab_lab_prod). Mismo Service Principal y mismos secrets.
# Sin --refresh-all: incremental.
name: Deploy to prod

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency: prod-${{ github.ref }}

jobs:
  validate:
    name: "Validate bundle"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_BUNDLE_ENV: production
          DATABRICKS_AUTH_TYPE: oauth-m2m

  deploy:
    name: "Deploy bundle"
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_BUNDLE_ENV: production
          DATABRICKS_AUTH_TYPE: oauth-m2m

  run_pipeline_job:
    name: "Run pipeline job"
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - shell: bash
        name: Run demo_08_job
        run: |
          databricks bundle run demo_08_job 2>&1 | tee output.log
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_BUNDLE_ENV: production
          DATABRICKS_AUTH_TYPE: oauth-m2m
